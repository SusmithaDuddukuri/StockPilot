[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpilot-warehouse"
version = "1.0.0"
description = "Warehouse inventory, stock movement audit, and order fulfilment dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Flask==3.1.0", "blinker==1.9.0", "click==8.1.8", "itsdangerous==2.2.0", "Jinja2==3.1.5", "MarkupSafe==3.0.2", "Werkzeug==3.1.3"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
